# Xcode project definition. Generate the .xcodeproj with:  cd mac && xcodegen
# Personal values (team, bundle ID prefix, web address) live in Local.xcconfig, which is not
# committed; copy Local.example.xcconfig to Local.xcconfig and fill it in.
name: Commitments
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  Commitments:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "I Commit!"
        CFBundleName: "I Commit!"
        LSApplicationCategoryType: public.app-category.productivity
        AppGroupID: $(TeamIdentifierPrefix)$(BUNDLE_ID_PREFIX).commitments
        AppHost: $(APP_HOST)
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID_PREFIX).commitments
            CFBundleURLSchemes: [commitments]
    entitlements:
      path: App/Commitments.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)$(BUNDLE_ID_PREFIX).commitments
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).commitments
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: CommitmentsWidget
  CommitmentsWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: "I Commit!"
        CFBundleName: "I Commit!"
        AppGroupID: $(TeamIdentifierPrefix)$(BUNDLE_ID_PREFIX).commitments
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/CommitmentsWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)$(BUNDLE_ID_PREFIX).commitments
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).commitments.widget
